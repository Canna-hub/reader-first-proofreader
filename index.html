<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader First Proofreader</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Reader First Proofreader</h1>

  <p>Preserve the author. Remove only the distractions.</p>

  <textarea
    id="manuscript"
    placeholder="Paste your writing here..."
    rows="20"
    cols="60"
  ></textarea>

  <br><br>

  <button id="analyzeButton">Analyze My Writing</button>

  <div id="results"></div>

</body>
</html>
