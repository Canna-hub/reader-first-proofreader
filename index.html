<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader First Proofreader</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

  <body>

  <div class="container">

    <header>
      <h1>Reader First Proofreader</h1>
      <p class="subtitle">
        Preserve the author. Remove only the distractions.
      </p>
    </header>

    <div class="editor">

      <main>
        <textarea
          id="manuscript"
          placeholder="Paste your manuscript here..."
        ></textarea>
      </main>

      <aside class="panel">

        <h2>Reader Friction</h2>

        <p>
          We'll look for things that may interrupt the reader,
          without rewriting your voice.
        </p>

        <button id="analyzeButton">
          Analyze My Writing
        </button>

        <div id="results"></div>

      </aside>

    </div>

  </div>

</body>

</body>
</html>
